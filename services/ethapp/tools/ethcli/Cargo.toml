[workspace]
# Standalone host tool — not part of the device workspace.

[package]
name = "ethcli"
version = "0.1.0"
edition = "2021"
description = "Host-side CLI for the Baochip-1x Ethereum hardware wallet"

[[bin]]
name = "ethcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Disable default features to avoid libudev system dep on Linux.
# Auto-detect by USB VID/PID is unavailable; user must pass --port.
serialport = { version = "4", default-features = false }
hex = "0.4"
anyhow = "1"
