[workspace]
# Standalone host tool — not part of the device workspace.

[package]
name = "ethcli"
version = "0.1.0"
edition = "2021"
description = "Host-side CLI for the Baochip-1x Ethereum hardware wallet"

[[bin]]
name = "ethcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Default features include libudev on Linux for USB VID/PID auto-detect.
# The flake.nix dev shells provide pkg-config + systemd (libudev) on Linux.
serialport = "4"
hex = "0.4"
anyhow = "1"
# JSON-RPC client for chain queries. Uses rustls (no openssl system dep).
ureq = { version = "2", features = ["json", "tls"] }
serde_json = "1"
# For verify-attestation (offline signature verification)
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
# For encrypted mnemonic import (ECIES)
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
# For QR code display in terminal
qrcode = { version = "0.14", default-features = false }
